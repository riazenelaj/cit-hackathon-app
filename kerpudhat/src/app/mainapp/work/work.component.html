<div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8">
  <!-- Replace with your content -->
  <div class="py-4">
    <!-- <div class="border-4 border-dashed border-gray-200 rounded-lg h-96"></div> -->
    <!-- This example requires Tailwind CSS v2.0+ -->
    <div class="px-4 py-5 border-b border-gray-200 sm:px-6">
      <div
        class="-ml-4 -mt-2 flex items-center justify-between flex-wrap sm:flex-nowrap"
      >
        <div class="ml-4 mt-2">
          <h3 class="text-3xl leading-6 font-medium text-gray-900">
            Job Postings
          </h3>
        </div>
        <div class="ml-4 mt-2 flex-shrink-0">
          <button
            (click)="newJobModal = true"
            type="button"
            class="relative inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"
          >
            Create new job
          </button>
        </div>
      </div>
    </div>
  </div>

  <article
    class="mt-2 rounded-xl bg-white p-4 ring ring-indigo-50 sm:p-6 lg:p-8"
    *ngFor="let i of works"
  >
    <div class="flex items-start sm:gap-8">
      <div>
        <ng-container> </ng-container>
        <h3 class="text-lg font-medium sm:text-xl">
          <a href="#" class="hover:underline">
            {{ i.title }}
          </a>
        </h3>

        <p class="mt-1 text-sm text-gray-700">
          {{ i.description }}
        </p>

        <div class="mt-4 sm:flex sm:items-center sm:gap-2">
          <div class="flex items-center gap-1 text-gray-500">
            <svg
              class="h-4 w-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>

            <p class="text-xs font-medium">48:32 minutes</p>
          </div>

          <span class="hidden sm:block" aria-hidden="true">&middot;</span>

          <p class="mt-2 text-xs font-medium text-gray-500 sm:mt-0">
            From
            <a href="#" class="underline hover:text-gray-700">Barry</a>,
          </p>
        </div>
      </div>
    </div>
  </article>
  <!-- /End replace -->
</div>

<app-new-job
  (closeEvent)="closeEvent($event)"
  *ngIf="newJobModal"
></app-new-job>
